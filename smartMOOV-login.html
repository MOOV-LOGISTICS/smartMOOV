<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>smartMOOV · Login</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--orient:#004F7C;--orient-dark:#003D61;--orange:#FE5000;--orange80:#FE7F40}
html,body{height:100%}
body{
  min-height:100vh;
  background:#060D1A;
  background-image:radial-gradient(circle,rgba(0,79,124,.055) 1px,transparent 1px);
  background-size:28px 28px;
  display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC',sans-serif;
  color:#C8D8E8;
}

/* ── EXPIRED SCREEN ── */
#expired-screen{
  display:none;flex-direction:column;align-items:center;text-align:center;
  padding:48px 36px;
  background:linear-gradient(135deg,rgba(0,30,56,.88),rgba(2,10,22,.94));
  border:1px solid rgba(255,255,255,.07);border-radius:16px;
  backdrop-filter:blur(20px);max-width:420px;width:90%;
  box-shadow:0 24px 64px rgba(0,0,0,.5);
}
.lock-icon{font-size:52px;margin-bottom:20px;filter:grayscale(1) opacity(.65)}
.exp-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;letter-spacing:.5px}
.exp-sub{font-size:11px;color:rgba(255,255,255,.35);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.exp-divider{width:40px;height:2px;background:linear-gradient(90deg,rgba(254,80,0,.5),transparent);margin:0 auto 24px}
.exp-body{font-size:13.5px;color:rgba(200,216,232,.6);line-height:1.85;margin-bottom:20px}
.exp-contact{font-size:12px;color:rgba(200,216,232,.38);line-height:2;border-top:1px solid rgba(255,255,255,.07);padding-top:18px;width:100%}
.exp-contact a{color:var(--orange80);text-decoration:none}
.exp-contact a:hover{text-decoration:underline}

/* ── LOGIN CARD ── */
#login-card{
  width:420px;max-width:94vw;
  background:linear-gradient(160deg,rgba(0,44,78,.82),rgba(2,14,28,.9));
  border:1px solid rgba(0,120,200,.2);
  border-top:2px solid var(--orange);
  border-radius:16px;padding:40px 36px 36px;
  backdrop-filter:blur(20px);
  box-shadow:0 24px 64px rgba(0,0,0,.45),0 0 0 1px rgba(0,79,124,.12);
}
.card-logo{text-align:center;margin-bottom:22px}
.card-logo img{height:30px}
.card-title{font-size:20px;font-weight:700;color:#fff;text-align:center;margin-bottom:4px}
.card-sub{font-size:11px;color:rgba(200,216,232,.4);text-align:center;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:32px}

/* Fields */
.field{margin-bottom:18px}
.field label{display:block;font-size:10.5px;font-weight:600;color:rgba(200,216,232,.55);letter-spacing:.9px;text-transform:uppercase;margin-bottom:7px}
.field-wrap{position:relative}
.field input{
  width:100%;padding:11px 16px;
  background:rgba(0,30,56,.65);
  border:1px solid rgba(0,120,200,.22);border-radius:8px;
  color:#E8F2FA;font-size:14px;outline:none;
  transition:border-color .2s,box-shadow .2s;font-family:inherit;
}
.field input::placeholder{color:rgba(200,216,232,.22)}
.field input:focus{border-color:rgba(254,80,0,.55);box-shadow:0 0 0 3px rgba(254,80,0,.1)}
.pw-toggle{
  position:absolute;right:11px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:rgba(200,216,232,.35);
  font-size:15px;padding:2px 4px;transition:color .2s;
}
.pw-toggle:hover{color:rgba(200,216,232,.75)}

/* Error */
#err-msg{
  display:none;
  background:rgba(254,80,0,.09);border:1px solid rgba(254,80,0,.28);
  border-radius:7px;padding:10px 14px;font-size:12.5px;
  color:var(--orange80);margin-bottom:18px;text-align:center;
}

/* Button */
.login-btn{
  width:100%;padding:13px;
  background:linear-gradient(135deg,var(--orange),var(--orange80));
  border:none;border-radius:8px;color:#fff;
  font-size:14px;font-weight:700;letter-spacing:.5px;
  cursor:pointer;transition:opacity .2s,transform .1s,box-shadow .2s;
  box-shadow:0 4px 16px rgba(254,80,0,.32);font-family:inherit;
}
.login-btn:hover{opacity:.9;box-shadow:0 6px 24px rgba(254,80,0,.48)}
.login-btn:active{transform:scale(.985)}

/* Lang */
.lang-row{display:flex;justify-content:center;margin-top:22px}
.lang-toggle{display:flex;border:1px solid rgba(255,255,255,.13);border-radius:20px;overflow:hidden}
.lang-btn{padding:4px 14px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.38);transition:all .2s;font-family:inherit}
.lang-btn.active{background:var(--orange);color:#fff}

.card-footer{font-size:10px;color:rgba(200,216,232,.18);text-align:center;margin-top:20px;letter-spacing:.3px}
</style>
</head>

<script>
var USERNAME = 'MOOVLOGISTIC';
var PASSWORD = 'smartMOOV';
// Expiry: 2026-06-17 23:59:59 Beijing time (14 days from 2026-06-03)
var EXPIRY   = new Date('2026-06-17T23:59:59+08:00').getTime();
var AUTH_KEY = 'smv_auth';
var CUR_LANG = 'zh';

var STR = {
  zh:{
    cardSub:'供应链控制塔 · Control Tower',
    lblUser:'用户名 / Username', lblPass:'密码 / Password',
    phUser:'输入用户名', phPass:'输入密码',
    btn:'登 录 &nbsp;/&nbsp; Sign In',
    errCred:'用户名或密码错误，请重试',
    expTitle:'访问已到期', expSub:'Access Expired',
    expBody:'此演示账号的有效访问期已结束。<br>The demo access for this account has ended.'
  },
  en:{
    cardSub:'Supply Chain Control Tower',
    lblUser:'Username', lblPass:'Password',
    phUser:'Enter username', phPass:'Enter password',
    btn:'Sign In',
    errCred:'Incorrect username or password. Please try again.',
    expTitle:'Access Expired', expSub:'访问已到期',
    expBody:'The demo access for this account has ended.<br>此演示账号的有效访问期已结束。'
  }
};

function setLang(l){
  CUR_LANG = l;
  localStorage.setItem('smv_lang', l);
  document.getElementById('btn-zh').classList.toggle('active', l==='zh');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  var s = STR[l];
  document.getElementById('card-sub').textContent  = s.cardSub;
  document.getElementById('lbl-user').textContent  = s.lblUser;
  document.getElementById('lbl-pass').textContent  = s.lblPass;
  document.getElementById('inp-user').placeholder  = s.phUser;
  document.getElementById('inp-pass').placeholder  = s.phPass;
  document.getElementById('login-btn').innerHTML   = s.btn;
  document.getElementById('exp-title').textContent = s.expTitle;
  document.getElementById('exp-sub').textContent   = s.expSub;
  document.getElementById('exp-body').innerHTML    = s.expBody;
}

function togglePw(){
  var i = document.getElementById('inp-pass');
  i.type = i.type === 'password' ? 'text' : 'password';
}

function showErr(msg){
  var el = document.getElementById('err-msg');
  el.textContent = msg; el.style.display = 'block';
}

function doLogin(){
  document.getElementById('err-msg').style.display = 'none';
  if(Date.now() > EXPIRY){ showErr(STR[CUR_LANG].errCred); return; }
  var user = document.getElementById('inp-user').value.trim();
  var pass = document.getElementById('inp-pass').value;
  if(user === USERNAME && pass === PASSWORD){
    localStorage.setItem(AUTH_KEY, '1');
    window.location.replace('smartMOOV-overview.html');
  } else {
    showErr(STR[CUR_LANG].errCred);
    document.getElementById('inp-pass').value = '';
    document.getElementById('inp-pass').focus();
  }
}

document.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

// ── INIT ──
(function(){
  var expired = Date.now() > EXPIRY;
  if(expired){
    document.getElementById('login-card').style.display     = 'none';
    document.getElementById('expired-screen').style.display = 'flex';
  } else {
    if(localStorage.getItem(AUTH_KEY) === '1'){
      window.location.replace('smartMOOV-overview.html');
      return;
    }
  }
  setLang(localStorage.getItem('smv_lang') || 'zh');
})();
</script>
